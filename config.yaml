# Every knob for the study lives here.

seed: 0

split:
  train: 50
  val: 70
  test: 247

data:
  proofnet_verified:
    repo: marcusm117/ProofNet-Verified
    commit: 160414332dc196583f6c37c310b420d2a3b07c58
  minif2f:
    repo: AI-MO/minif2f_test
    revision: 5def318348521dfc34875045a9ecddf729a2b49f

axle:
  environment: lean-4.28.0
  timeout_seconds: 120         # Lean time budget per check; exceeding it is a timeout (a failure)
  max_concurrency: 16
  client_timeout_seconds: 300  # how long the axle client keeps retrying 503/429 inside one attempt
  outage_retries: 3            # our own retries on top of the client's
  outage_backoff_seconds: 30   # doubles each retry
  cache_dir: cache/axle

budget:
  total_usd: 300
  chunk_caps_usd: {1: 0, 2: 10, 3: 3, 4: 30, 5: 180, 6: 5, 7: 5}

llm:
  base_url: https://api.together.xyz/v1
  cache_dir: cache/llm
  retries: 4
  backoff_seconds: 5
  timeout_seconds: 300
  prices:  # USD per 1M tokens (Together model list, 2026-10-17)
    openai/gpt-oss-120b: {input: 0.15, output: 0.6}
    deepseek-ai/DeepSeek-V4.1-Flash: {input: 0.3, output: 1.2}
    zai-org/GLM-5.3-Flash: {input: 0.15, output: 0.5}
    moonshotai/Kimi-K2.6: {input: 1.2, output: 4.5}
    Qwen/Qwen3.5-9B: {input: 0.17, output: 0.25}
    qwen3-8b: {input: 0, output: 0}   # served by vLLM on the pod; GPU time is logged separately
    reform-8b: {input: 0, output: 0}

# Placeholders until the pilot (chunk 4): two different non-Qwen families.
judges:
  optimization: openai/gpt-oss-120b
  reference: deepseek-ai/DeepSeek-V4.1-Flash
  gloss: zai-org/GLM-5.3-Flash
  max_tokens: 4000
  gloss_max_tokens: 8000

scoring:
  stripper: ours  # set by the chunk 2 contest: AXLE remove_comments only if it passes every strip.CASES entry
  certificates: true

# Formalizers. vLLM serves both on one H100 (scripts/setup_pod.sh); base URLs are on the pod.
models:
  qwen3-8b:
    hf_id: Qwen/Qwen3-8B
    base_url: http://localhost:8000/v1
    enable_thinking: false     # decide in pilot
  reform-8b:
    hf_id: GuoxinChen/ReForm-8B
    base_url: http://localhost:8010/v1   # not 8001: RunPod's nginx proxy listens there
  smoke:                       # chunk 3 live smoke call only: same client code through Together
    served_name: Qwen/Qwen3.5-9B
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
    enable_thinking: false
  arm_f:                       # arm F's frontier model, through Together; placeholder until the pilot
    served_name: moonshotai/Kimi-K2.6
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY

# Identical across arms; decide in pilot.
generation:
  temperature: 0.6
  samples: 1
  max_tokens: 16384
  seed: 0
  workers: 16

arms:
  A: {model: qwen3-8b, prompt: prompts/arm_A.txt}
  B: {model: qwen3-8b, gepa_runs: [B_s0, B_s1, B_s2]}
  C: {model: reform-8b, prompt: prompts/arm_C.txt}
  D: {model: reform-8b, gepa_runs: [D_s0, D_s1, D_s2]}
  E: {model: qwen3-8b, prompt: prompts/arm_E.txt}
  F: {model: arm_f, prompt: prompts/arm_A.txt, test_only: true}

gepa:
  max_metric_calls: 800            # decide in pilot
  reflection_model: moonshotai/Kimi-K2.6   # placeholder until the pilot; not Qwen, not the reference judge's family
  reflection_max_tokens: 8000
  runs:
    B_s0: {model: qwen3-8b, seed: 0, seed_prompt: prompts/arm_A.txt}
    B_s1: {model: qwen3-8b, seed: 1, seed_prompt: prompts/arm_A.txt}
    B_s2: {model: qwen3-8b, seed: 2, seed_prompt: prompts/arm_A.txt}
    D_s0: {model: reform-8b, seed: 0, seed_prompt: prompts/arm_C.txt}
    D_s1: {model: reform-8b, seed: 1, seed_prompt: prompts/arm_C.txt}
    D_s2: {model: reform-8b, seed: 2, seed_prompt: prompts/arm_C.txt}

# Chunk 4 pilot: val items only.
pilot:
  val_items: 30
  seed: 0
  label_items: 20          # 10 Qwen3-8B (5 per thinking mode) and 10 ReForm-8B, compiled outputs only
  arm_f_items: 10          # arm F's model on the first 10 pilot items, for its cost per item
  # The short GEPA run. Kept out of gepa.runs so chunk 5 and the firewall never see it.
  gepa_run_id: pilot_qwen
  gepa_run: {model: qwen3-8b, seed: 0, seed_prompt: prompts/arm_A.txt, max_metric_calls: 150, enable_thinking: false}

gpu:
  type: H100 SXM 80GB            # RunPod, chunk 4 pod (PCIe and NVL were out of capacity)
  usd_per_hour: 3.99

pod:
  vllm_version: 0.30.0             # 2026-09-22 release
  workdir: /workspace
  repo_dir: /workspace/gepa-lean-formalizers
  gpu_memory_utilization: 0.45     # per server; two servers share one H100
  max_model_len: 40960

analysis:
  threshold_points: 5              # placeholder; Neel confirms at the freeze
  bootstrap_resamples: 10000
  seed: 0
