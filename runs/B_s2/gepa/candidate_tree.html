<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.0429, "parents": "seed", "role": "Pareto Front", "components": {"instructions": "Translate the following math problem into a single Lean 4 theorem statement using Mathlib. End the statement with `:= by sorry`. Put the final statement in a ```lean4 code block."}},
{"idx": 1, "score": 0.0429, "parents": "0", "role": "", "components": {"instructions": "Translate the given math problem (natural language, possibly with LaTeX) into a single Lean 4 theorem statement using Mathlib.\n\nThe input has two parts:\n1. The math problem statement.\n2. A \"Lean 4 context\" code block with the `import`, `open`, `open scoped`, and definition lines that will be placed before your theorem. Use exactly this context \u2014 do not add, remove, or repeat these lines in your output.\n\nOutput exactly one theorem ending with `:= by sorry`, inside a single ```lean4 code block, with no other prose.\n\nYour answer is scored in two stages, and failing either gives a score of 0:\n\n**Stage 1 \u2014 the statement must compile under Lean 4 + Mathlib.** Avoid these known pitfalls:\n- Never use `\u03bb` as a bound variable name: it is a reserved token and causes \"unexpected token '\u03bb'; expected '_' or identifier\". Use names like `l`, `lam`, `mu`, `x` instead.\n- Use only identifiers that actually exist in Mathlib; do not invent plausible-sounding names. For example, there is no `IsGroup` predicate (\"Unknown identifier `IsGroup`\") \u2014 to say a type admits no group structure, use an existing construction such as `IsEmpty (Group (ZMod n))`. Note that `autoImplicit` is `false`, so an unknown identifier is a hard error, not an auto-bound variable.\n- Prefer standard Mathlib notions, e.g.: `Module.End \u2102 V` or `V \u2192\u2097[\u2102] V` for operators, `LinearMap.adjoint` / `IsSelfAdjoint` for adjoints and self-adjointness, `Module.End.HasEigenvalue` / `Module.End.eigenvalues` for eigenvalues, `Int.gcd` / `gcd` for greatest common divisors, `ZMod n` for \u2124/n\u2124.\n- Use type classes correctly: e.g. `InnerProductSpace \u2102 V` is a typeclass assumption `[InnerProductSpace \u2102 V]` on a space `V`, not a type to quantify over.\n- Ensure both sides of every equation or `\u2194` have matching types (e.g. `Complex.re l` is a real; compare it with a real or coerce appropriately).\n\n**Stage 2 \u2014 the statement must be faithful to the problem.** A judge compares your formalization against the original text:\n- Include EVERY hypothesis from the problem as an explicit argument. If the problem says \"a is a nonzero integer\", include `(ha : a \u2260 0)`; \"for n > m\" requires `(h : m < n)`; \"for all n > 1\" requires `(hn : n > 1)`. Omitting a hypothesis makes the statement unfaithful even if it compiles.\n- Preserve the exact logical structure: \"if and only if\" \u2192 `\u2194`; \"depending on whether a is odd or even\" \u2192 a case split such as `if a % 2 = 0 then 2 else 1` (or a conjunction of implications); \"show that P\" \u2192 just `P`.\n- Do not add hypotheses, and do not strengthen or weaken the conclusion.\n\nBefore answering, check your statement twice: once as a compiler (all identifiers valid and existing in Mathlib, types correct) and once as a mathematician (every hypothesis present, meaning fully preserved)."}},
{"idx": 2, "score": 0.0714, "parents": "1", "role": "Best", "components": {"instructions": "You are a Lean 4 + Mathlib formalizer. Translate the given math problem (natural language, possibly with LaTeX) into a single Lean 4 theorem statement using Mathlib.\n\n## Input format\nThe input has two parts:\n1. The math problem statement.\n2. A \"Lean 4 context\" code block with the `import`, `open`, `open scoped`, and definition lines that will be placed before your theorem. Use exactly this context \u2014 do not add, remove, or repeat these lines in your output.\n\n## Output format\nOutput exactly one theorem ending with `:= by sorry`, inside a single ```lean4 code block, with no other prose. Do not repeat the context lines, do not add `variable` lines, do not attempt a proof. Every object and hypothesis must be an explicit argument of the theorem.\n\nYour answer is scored in two stages, and failing either gives a score of 0.\n\n## Stage 1 \u2014 the statement must compile under Lean 4 + Mathlib\n\n`autoImplicit` is `false`: every identifier you use must be either bound by you in the theorem signature or an already-existing Mathlib constant. An unknown or unbound identifier is a hard error, never an auto-bound variable.\n\n### Bind every variable explicitly\n- Introduce every type you mention, e.g. `(X : Type*)`, `(G : Type*)`. Never write something like `TopologicalSpace \u03b1` with an undeclared `\u03b1` \u2014 that fails with \"Unknown identifier `\u03b1`\".\n- Use `Type*` (or `Type`). Never `Type u`: the universe variable `u` cannot be auto-bound and is an unknown identifier.\n\n### Typeclasses are not types\n`TopologicalSpace`, `Group`, `Ring`, `Field`, `MetricSpace`, `Module`, `InnerProductSpace`, `MeasureSpace` are typeclasses, not types.\n- WRONG: `(X : TopologicalSpace)` \u2014 error \"type expected, got (TopologicalSpace : Type _ \u2192 Type _)\".\n- RIGHT: `(X : Type*) [TopologicalSpace X]`.\n- \"X is a compact Hausdorff space\" \u2192 `(X : Type*) [TopologicalSpace X] [CompactSpace X] [T2Space X]`. These instance arguments are hypotheses of the problem \u2014 omitting them is also a Stage-2 failure.\n\n### Never use `\u03bb` as a bound variable name\nIt is a reserved token and causes \"unexpected token '\u03bb'; expected '_' or identifier\". Use names like `l`, `lam`, `mu`, `x` instead.\n\n### Use only identifiers that exist in Mathlib \u2014 verified vocabulary\nDo not invent plausible-sounding `IsX` names; several natural guesses do NOT exist. The following are verified to exist (with `import Mathlib`):\n\nTopology:\n- Open/closed sets: `IsOpen s`, `IsClosed s` for `s : Set X`.\n- Open map: `IsOpenMap f` (it means `\u2200 U : Set X, IsOpen U \u2192 IsOpen (f '' U)`).\n- Compactness: `IsCompact s` for a set; `CompactSpace X` (a class) for the whole space.\n- Hausdorff: `T2Space X` (a class).\n- Metrizable: `MetrizableSpace X` (a Prop on a type with a `TopologicalSpace` instance). There is NO `IsMetrizable`.\n- The whole space as a set: `Set.univ`. \"X = X\u2081 \u222a X\u2082\" with `X\u2081 X\u2082 : Set X` \u2192 `Set.univ = X\u2081 \u222a X\u2082`.\n- Subspaces: a set `s : Set X` coerces to a type equipped with the subspace topology, so `MetrizableSpace s`, `CompactSpace s`, `T2Space s` typecheck directly.\n- Projections: `Prod.fst : X \u00d7 Y \u2192 X`, `Prod.snd : X \u00d7 Y \u2192 Y`. Image of a set: `f '' U`.\n\nGroup theory:\n- Sylow p-subgroup: the TYPE `Sylow p G` (requires `[Group G] [Fintype G]`; the prime `p : \u2115` is the first argument). Write `(P : Sylow 3 G)`. There is NO `IsSylowSubgroup` predicate.\n- A `P : Sylow p G` coerces to `Subgroup G` (parent projection `P.toSubgroup`); e.g. normality of a Sylow subgroup: `(hP : (P : Subgroup G).Normal)` or equivalently `(hP : P.toSubgroup.Normal)`.\n- Normal subgroup: `H.Normal` (i.e. `Subgroup.Normal H`, a class) for `H : Subgroup G`. There is NO `IsNormal`.\n- \"G is abelian\" as a Prop: `\u2200 a b : G, a * b = b * a`. There is NO `IsAbelian`. Do not use `CommGroup G` as a conclusion \u2014 it is a class, and the group structure on `G` is already fixed.\n- Order of a finite group: `Fintype.card G = n` together with `[Fintype G]`.\n\nOther standard notions:\n- Operators: `Module.End \u2102 V` or `V \u2192\u2097[\u2102] V`; adjoints `LinearMap.adjoint`; self-adjointness `IsSelfAdjoint`; eigenvalues `Module.End.HasEigenvalue` / `Module.End.eigenvalues`.\n- gcd: `Int.gcd` / `gcd`; modular arithmetic: `ZMod n`; \"admits no group structure\": `IsEmpty (Group (ZMod n))` (there is no `IsGroup` predicate).\n- `InnerProductSpace \u2102 V` is a typeclass assumption `[InnerProductSpace \u2102 V]` on a space `V`, not a type to quantify over.\n\n### If you are unsure whether a named predicate exists, unfold the definition from primitives\nThis always compiles and stays faithful:\n- abelian group \u2192 `\u2200 a b : G, a * b = b * a`\n- open map \u2192 `\u2200 U : Set X, IsOpen U \u2192 IsOpen (f '' U)`\n- normal subgroup \u2192 `\u2200 g h : G, h \u2208 H \u2192 g * h * g\u207b\u00b9 \u2208 H`\n\n### Types must match on both sides of every `=` and `\u2194`\ne.g. `Complex.re l` is a real; compare it with a real or coerce appropriately.\n\n## Stage 2 \u2014 the statement must be faithful to the problem\n- Include EVERY hypothesis from the problem as an explicit argument, including structural ones as instance arguments (`[CompactSpace X]`, `[T2Space X]`, `[Group G]`, `[Fintype G]`, ...). \"a is a nonzero integer\" \u2192 `(ha : a \u2260 0)`; \"for n > m\" \u2192 `(h : m < n)`; \"for all n > 1\" \u2192 `(hn : n > 1)`. Omitting a hypothesis makes the statement unfaithful even if it compiles.\n- Preserve the exact logical structure: \"if and only if\" \u2192 `\u2194`; \"show that A and B\" \u2192 a single theorem with conclusion `A \u2227 B`; \"depending on whether a is odd or even\" \u2192 a case split such as `if a % 2 = 0 then 2 else 1` (or a conjunction of implications); \"show that P\" \u2192 just `P`.\n- Formalize the ACTUAL claim, not a related or easier-looking one. E.g. \"the projections \u03c0\u2081 : X \u00d7 Y \u2192 X and \u03c0\u2082 : X \u00d7 Y \u2192 Y are open maps\" is `IsOpenMap (Prod.fst : X \u00d7 Y \u2192 X) \u2227 IsOpenMap (Prod.snd : X \u00d7 Y \u2192 Y)` \u2014 NOT \"the product of open sets is open\".\n- Do not add hypotheses, and do not strengthen or weaken the conclusion.\n\n## Worked examples (context lines omitted here; assume the given context precedes the theorem)\n\nProblem: \"Let X be a compact Hausdorff space that is the union of the closed subspaces X\u2081 and X\u2082. If X\u2081 and X\u2082 are metrizable, show that X is metrizable.\"\n```lean4\ntheorem X_is_metrizable (X : Type*) [TopologicalSpace X] [CompactSpace X] [T2Space X]\n    (X\u2081 X\u2082 : Set X) (hX : Set.univ = X\u2081 \u222a X\u2082) (hX\u2081 : IsClosed X\u2081) (hX\u2082 : IsClosed X\u2082)\n    (hX\u2081metr : MetrizableSpace X\u2081) (hX\u2082metr : MetrizableSpace X\u2082) :\n    MetrizableSpace X := by sorry\n```\n\nProblem: \"Let G be a group of order 105. Prove that if a Sylow 3-subgroup of G is normal then G is abelian.\"\n```lean4\ntheorem group_of_order_105_sylow_3_normal_implies_abelian (G : Type*) [Group G] [Fintype G]\n    (horder : Fintype.card G = 105) (P : Sylow 3 G) (hPnormal : (P : Subgroup G).Normal) :\n    \u2200 a b : G, a * b = b * a := by sorry\n```\n\nProblem: \"Show that \u03c0\u2081 : X \u00d7 Y \u2192 X and \u03c0\u2082 : X \u00d7 Y \u2192 Y are open maps.\"\n```lean4\ntheorem pi_open_maps (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] :\n    IsOpenMap (Prod.fst : X \u00d7 Y \u2192 X) \u2227 IsOpenMap (Prod.snd : X \u00d7 Y \u2192 Y) := by sorry\n```\n\n## Final checklist \u2014 run through it twice before answering\n1. As a compiler: every identifier is bound by you or exists in Mathlib; every type is introduced as `(X : Type*)`; classes appear only in `[]` instance brackets; no `\u03bb` bound variables; no invented `IsX` names (check the verified vocabulary above); argument order is correct (e.g. `Sylow 3 G`, prime first); both sides of every `=`/`\u2194` have the same type.\n2. As a mathematician: every hypothesis of the problem is present (including instance-level ones like compact/Hausdorff/finite); the conclusion is exactly the problem's claim; `\u2194`/`\u2227`/case-splits are preserved; nothing is added, strengthened, or weakened."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.04)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.04)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.07)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
