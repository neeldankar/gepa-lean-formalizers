oided: a family needs an index type (`T : \u03b9 \u2192 Set (Set X)`, not `T : Set (Set X)` applied to `\u03b1`); \"does not need to be\" is an existential counterexample, not `\u2200 ... \u2192 \u00ac ...`.\n```lean4\ntheorem union_of_topologies_not_necessarily_a_topology :\n    \u2203 (X : Type) (\u03b9 : Type) (T : \u03b9 \u2192 Set (Set X)),\n      (\u2200 \u03b1, is_topology X (T \u03b1)) \u2227 \u00ac is_topology X (\u22c3 \u03b1, T \u03b1) := by sorry\n```\n\nProblem: \"If a is a nonzero integer, then for n > m show that (a^(2^n)+1, a^(2^m)+1) = 1 or 2 depending on whether a is odd or even.\" (opens include Real, scoped BigOperators)\nPitfall avoided: the \"nonzero\" hypothesis `ha : a \u2260 0` must appear.\n```lean4\ntheorem gcd_pow_two_pow_add_one (a : \u2124) (ha : a \u2260 0) (n m : \u2115) (h : n > m) :\n    gcd (a ^ (2 ^ n) + 1) (a ^ (2 ^ m) + 1) = if a % 2 = 0 then 1 else 2 := by sorry\n```\n\nProblem: \"Prove that the power series \u2211 z^n/n converges at every point of the unit circle except z = 1.\" (opens include Complex Filter Function Metric Finset; scoped BigOperators Topology)\nPitfalls avoided: no comma in `fun` binders; no `Set.unitCircle` (use `\u2016z\u2016 = 1`); series convergence is `Summable` of the actual terms `z ^ n / n`, not a limit of an invented `f`.\n```lean4\ntheorem summable_z_pow_div_n_on_unit_circle_ne_one :\n    \u2200 z : \u2102, \u2016z\u2016 = 1 \u2192 z \u2260 1 \u2192 Summable (fun n : \u2115 => z ^ n / n) := by sorry\n```\n\nProblem: \"Let x be an element of G. Prove that if |x| = n for some positive integer n then x\u207b\u00b9 = x^(n-1).\" (opens include Fintype Subgroup Set Polynomial Ideal; scoped BigOperators)\nPitfalls avoided: \"|x| = n\" is `orderOf x = n`, NOT the weaker `x ^ n = 1`; \"positive integer n\" adds the hypothesis `hn : 0 < n`.\n```lean4\ntheorem inverse_equal_to_power_minus_one (G : Type*) [Group G] (x : G) (n : \u2115)\n    (hn : 0 < n) (hord : orderOf x = n) :\n    x\u207b\u00b9 = x ^ (n - 1) := by sorry\n```\n\nProblem: \"Show that there is an infinite number of integers a such that f(x) = x^7 + 15x^2 - 30x + a is irreducible in \u211a[x].\" (opens include Fintype Set Real Ideal Polynomial; scoped BigOperators)\nPitfalls avoided: \"infinite number of a\" is `Set.Infinite {a : \u2124 | ...}`, not a claim about one `a`; the polynomial is written concretely with `X` and `C` (no generic `f : \u211a[X] \u2192 \u211a[X]`); the integer `a` is coerced via `C (a : \u211a)` so no `HSub`/`HAdd` typeclass failure occurs.\n```lean4\ntheorem infinite_irreducible_polynomials :\n    Set.Infinite {a : \u2124 | Irreducible (X ^ 7 + C 15 * X ^ 2 - C 30 * X + C (a : \u211a) : \u211a[X])} := by sorry\n```\n\nProblem: \"Prove that every open set in \u211d is the union of an at most countable collection of disjoint segments.\" (opens include Topology Filter Real Complex TopologicalSpace Finset Set; scoped BigOperators)\nPitfall avoided: even when the formalization is nontrivial, you MUST still emit one closed code block with a best-effort theorem \u2014 an empty answer scores zero. \"At most countable\" is `Set.Countable`; \"segments\" are open intervals `Ioo a b`; union of a set of sets is `\u22c3\u2080 T`.\n```lean4\ntheorem open_set_eq_countable_union_disjoint_intervals (s : Set \u211d) (hs : IsOpen s) :\n    \u2203 T : Set (Set \u211d), T.Countable \u2227 (\u2200 t \u2208 T, \u2203 a b : \u211d, t = Ioo a b) \u2227\n      (\u2200 t\u2081 \u2208 T, \u2200 t\u2082 \u2208 T, t\u2081 \u2260 t\u2082 \u2192 Disjoint t\u2081 t\u2082) \u2227 s = \u22c3\u2080 T := by sorry\n```\n\nProblem: \"Let f be a real function with a continuous third derivative such that f(x), f'(x), f''(x), f'''(x) are positive for all x. Suppose f'''(x) \u2264 f(x) for all x. Show that f'(x) < 2 f(x) for all x.\" (opens include Filter Topology Set)\nPitfall avoided: \"continuous (everywhere)\" is `Continuous (...)`, NOT `ContinuousOn (...) \u211d` \u2014 `ContinuousOn` expects a `Set \u211d` as its second argument and `\u211d` is a type, so `ContinuousOn ... \u211d` fails with \"Application type mismatch\". The third derivative is `iteratedDeriv 3 f`.\n```lean4\ntheorem derivative_bound (f : \u211d \u2192 \u211d) (hf : Continuous (iteratedDeriv 3 f))\n    (hpos : \u2200 x, 0 < f x \u2227 0 < deriv f x \u2227 0 < iteratedDeriv 2 f x \u2227 0 < iteratedDeriv 3 f x)\n    (hle : \u2200 x, iteratedDeriv 3 f x \u2264 f x) :\n    \u2200 x, deriv f x < 2 * f x := by sorry\n```\n\nProblem: \"Prove that, for any integers a, b, c, there exists a positive integer n such that \u221a(n\u00b3+an\u00b2+bn+c) is not an integer.\" (scoped BigOperators)\nPitfalls avoided: \"\u221am is not an integer\" is `\u00ac \u2203 k : \u2124, k ^ 2 = m`; \"positive integer n\" is `0 < n`; the `n : \u2115` coerces automatically into the `\u2124`-valued expression.\n```lean4\ntheorem exists_positive_n_non_integer_sqrt (a b c : \u2124) :\n    \u2203 n : \u2115, 0 < n \u2227 \u00ac \u2203 k : \u2124, k ^ 2 = n^3 + a * n^2 + b * n + c := by sorry\n```\n\nProblem: \"Show that 2 is divisible by (1+i)\u00b2 in \u2124[i].\" (opens include Real)\nPitfalls avoided: the Gaussian integers are `GaussianInt` (NOT `\u2124[i]`, which is misparsed as indexing) and the imaginary unit is `GaussianInt.i` (NOT `\ud835\udd5a`); divisibility is `\u2223`.\n```lean4\ntheorem two_divisible_by_one_plus_i_squared_in_gaussian_int :\n    (1 + GaussianInt.i) ^ 2 \u2223 (2 : GaussianInt) := by sorry\n```\n\n## Final checklist before answering\n(a) Every identifier is either a bound variable, a definition from the context, or a real Mathlib name available under the given opens (no `Set.unitCircle`, no `ConstantOn`, no `Im`/`Re`, no `f'`/`f''`/`f'''`, no `|x|` for order, no `\u2124[i]`, no `\ud835\udd5a`).\n(b) Syntax is valid Lean 4: `fun ... => ...` binders with NO comma, typeclasses in `[...]`, no invented notation.\n(c) ALL hypotheses of the problem appear (re-scan for \"nonzero\", \"positive\", strict inequalities) and NONE are weakened: `orderOf x = n` rather than `x ^ n = 1`; `0 < n` included when n is said to be positive. The conclusion matches the problem, with each case value attached to the correct condition.\n(d) Indexed families use an index type (`T : \u03b9 \u2192 ...`); a `Set` is never applied to an index.\n(e) \"Not necessarily / does not need to be\" is `\u2203 ... \u2227 \u00ac ...`, not `\u2200 ... \u2192 \u00ac ...`.\n(f) Concrete objects from the problem (specific series, maps, numbers, polynomials) are written out explicitly \u2014 polynomials via `X` and `C` with explicit coercions like `C (a : \u211a)` \u2014 never replaced by generic variables or functions.\n(g) \"Infinitely many ... such that P\" is `Set.Infinite { ... | P ... }`; \"at most countable\" is `Set.Countable`.\n(h) The statement ends with `:= by sorry` inside exactly one OPENED AND CLOSED ```lean4 code block \u2014 never an empty, prose-only, or unclosed answer.\n(i) Set-expecting functions (`ContinuousOn`, `DifferentiableOn`, `Set.EqOn`, ...) receive an actual `Set` argument, NEVER a type like `\u211d`; \"everywhere / for all x\" is the global predicate (`Continuous`, `Differentiable`, `\u2200 x, DifferentiableAt \u211d f x`) or `Set.univ`.\n(j) Special number systems use their real Mathlib names: Gaussian integers are `GaussianInt` with imaginary unit `GaussianInt.i`; divisibility is `b \u2223 a` or `\u2203 q, a = b * q`; \"\u221am is not an integer\" is `\u00ac \u2203 k : \u2124, k ^ 2 = m`.\n`"}},
{"idx": 6, "score": 0.1143, "parents": "3", "role": "Pareto Front", "components": {"instructions": "Translate the following math problem into a single Lean 4 theorem statement using Mathlib. The statement MUST compile under the given context. End the statement with `:= by sorry`. Put the final statement in a ```lean4 code block.\n\n## Input format\nYou will receive:\n1. A math problem stated in LaTeX.\n2. A \"Lean 4 context\" code block containing the `import`, `open`, and `open scoped` lines to assume, and possibly additional `def`s. Do NOT repeat these lines; write exactly one theorem. If the context provides a custom definition (e.g. `def is_topology ...`), use it exactly as declared, with arguments of the right types.\n\n## Output format\n- Exactly one theorem inside a single ```lean4 code block, ending with `:= by sorry`.\n\n## Recommended process\n1. Extract from the problem text a list of ALL hypotheses and the exact conclusion.\n2. For EACH hypothesis and for the conclusion, record the EXACT DOMAIN on which it is stated (e.g. \"for x \u2265 0\", \"for x > 0\", \"on \u03a9\", \"everywhere\"). You will need this for the domain audit in the checklist.\n3. Map each mathematical concept to a verified Mathlib identifier, or to basic logic (`\u2200`, `\u2203`, `=`, `\u2227`, `\u00ac`, `\u2192`) built from well-established functions.\n4. Write the statement, then mentally type-check every application.\n5. Run the final checklist below.\n\n## Correctness requirements\nA statement scores 0 if it does not compile, AND also if it compiles but is unfaithful. Both audits below are mandatory.\n\n1. **Faithfulness.** Include EVERY hypothesis from the problem and formalize the conclusion precisely.\n   - **Hypothesis audit.** Easy-to-miss side conditions count: \"a is nonzero\" needs `ha : a \u2260 0`; \"x > 0\", \"n > m\", \"f is holomorphic in \u03a9\" (`hf : DifferentiableOn \u2102 f \u03a9`) all need explicit hypotheses. Omitting `a \u2260 0` is a faithfulness error even when the statement compiles.\n   - **Domain audit.** A property stated on a restricted domain must be formalized on EXACTLY that domain, using the `...On` predicates with the correct interval set:\n     - \"f is continuous for x \u2265 0\" is `ContinuousOn f (Set.Ici 0)`, NOT `ContinuousOn f (Set.Icc 0 0)` \u2014 `Set.Icc 0 0 = {0}` is a singleton, so that only asserts continuity at the single point 0.\n     - \"g is monotonically increasing for x > 0\" is `MonotoneOn g (Set.Ioi 0)`, NOT `Monotone g` \u2014 `Monotone g` quantifies over ALL reals, including points where `g` may be undefined (e.g. `g x = f x / x` at `x \u2264 0`).\n     - Interval sets: `Set.Ici a = {x | a \u2264 x}`, `Set.Ioi a = {x | a < x}`, `Set.Iic a = {x | x \u2264 a}`, `Set.Iio a = {x | x < a}`, `Set.Icc a b = [a,b]`, `Set.Ioo a b = (a,b)`.\n     - The same applies to `DifferentiableOn`, `ContinuousOn`, `MonotoneOn`, `Set.EqOn`, etc. Global predicates (`Monotone`, `Continuous`, `Differentiable`) quantify over the whole type; use them only when the problem really says \"everywhere\".\n   - **\"Not necessarily\" / \"does not need to be\".** This means a counterexample EXISTS: `\u2203 ..., (all hypotheses) \u2227 \u00ac P`. It does NOT mean `\u2200 ..., hypotheses \u2192 \u00ac P` \u2014 that claims P never holds, which is usually false and unfaithful.\n   - **Concrete objects stay concrete.** Formalize the actual objects named in the problem (e.g. the specific series `z ^ n / n`, the projection `Prod.fst`). Do NOT introduce a generic uninterpreted function or variable as a stand-in for a concrete object.\n   - **Existence claims: state the required properties as conjuncts; do NOT construct the witness.** For \"there exist r \u2265 0 and w with |w| = 1 such that z = r w\", write `\u2203 (r : \u211d) (w : \u2102), r \u2265 0 \u2227 \u2016w\u2016 = 1 \u2227 z = r * w`. Never invent helper constants (e.g. `Complex.unitCircle`) and never write circular \"definitions\" of the witness inside the statement.\n   - **Case conclusions.** For \"... = 1 or 2 depending on whether a is odd or even\", an `if ... then ... else ...` (or a disjunction) is fine, but attach each value to the mathematically correct case.\n   - \"P is constant\" means `\u2203 c, \u2200 z \u2208 s, P z = c` \u2014 it does NOT mean `P z = 0`.\n2. **It must compile.** Use only identifiers that actually exist in Mathlib under the given opens. Never invent names or notation. If you are unsure whether a named predicate exists, express the concept with basic logic and well-established Mathlib functions instead.\n\n## Lean 4 / Mathlib facts (respect these)\n- **Lambdas:** write `fun x => ...` or `fun x \u21a6 ...`. NEVER write `\u03bb x, ...` or `fun n : \u2115 \u2192 \u2102, f n` \u2014 a comma after the binder is a syntax error (\"unexpected token ','; expected '\u21a6', '=>'\"). A typed binder is `fun (n : \u2115) => ...` or `fun n : \u2115 => ...`; the ascribed type is the type of the bound variable itself.\n- **Typeclasses:** `TopologicalSpace`, `MetricSpace`, `NormedField`, etc. are typeclasses, not types. Declare spaces as `(X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y]`. Writing `(X Y : TopologicalSpace)` fails with \"type expected, got (TopologicalSpace : Type _ \u2192 Type _)\".\n- **Sets vs. indexed families:** if `s : Set X` and `x : X`, then `s x` is the PROPOSITION `x \u2208 s`, not a set. A family \"T_\u03b1\" must be declared with an index type and a function, e.g. `(\u03b9 : Type*) (T : \u03b9 \u2192 Set (Set X))`; then `T \u03b1 : Set (Set X)` and its union is `\u22c3 \u03b1, T \u03b1` (`Set.iUnion`, needs `open Set`). Declaring `(T : Set (Set X))` and then writing `T \u03b1` fails with \"Application type mismatch ... has type Prop ... but is expected to have type Set (Set X)\".\n- **Big unions/intersections vs. binary ones:** `\u22c3 i, U i` and `\u22c2 i, C i` (with a binder) are `Set.iUnion` / `Set.iInter`. The symbols `\u222a` and `\u2229` are BINARY infix operators only \u2014 writing `\u2229 i, C i` is a syntax error (\"unexpected token '\u2229'; expected ...\"). \"The intersection is nonempty\" is `(\u22c2 i, C i).Nonempty` or `(\u22c2 i, C i) \u2260 \u2205`; \"each C i is nonempty\" is `\u2200 i, (C i).Nonempty` or `\u2200 i, C i \u2260 \u2205`.\n- **Chaining conditions on a quantified family:** prefer nested implications over one long `\u2227`-chain mixed with `\u2192`, because `\u2200` and `\u2192` extend as far right as possible, so `A \u2227 B \u2227 \u2200 i j, i \u2264 j \u2192 P i j \u2192 Q` puts `Q` INSIDE the `\u2200` \u2014 rarely what you intend. Write e.g. `\u2200 (C : \u2115 \u2192 Set X), (\u2200 i, IsClosed (C i)) \u2192 (\u2200 i, (C i).Nonempty) \u2192 (\u2200 i j, i \u2264 j \u2192 C j \u2286 C i) \u2192 (\u22c2 i, C i).Nonempty`.\n- **Interval sets:** `Set.Ici a` is [a, \u221e), `Set.Ioi a` is (a, \u221e), `Set.Iic a` is (-\u221e, a], `Set.Iio a` is (-\u221e, a), `Set.Icc a b` is [a, b], `Set.Ioo a b` is (a, b). Beware: `Set.Icc 0 0 = {0}`.\n- **Derivative:** the derivative of `f : \u211d \u2192 \u211d` as a function is `deriv f`. There is no `f'` notation in Mathlib. \"f'(x) \u2192 L as x \u2192 +\u221e\" is `Tendsto (deriv f) atTop (nhds L)`.\n- **Differentiability:** `DifferentiableAt \u211d f x`, `DifferentiableOn \u211d f s`, `Differentiable \u211d f`. \"f is holomorphic on an open set \u03a9\" is `DifferentiableOn \u2102 f \u03a9` (plus `h\u03a9 : IsOpen \u03a9` when given).\n- **Limits:** \"g(x) \u2192 L as x \u2192 +\u221e\" is `Tendsto (fun x => g x) atTop (nhds L)` (needs `open Filter` and `open Topology` for `Tendsto`/`atTop`/`nhds`).\n- **Series:** \"the series \u2211 a\u2099 converges\" is `Summable (fun n => a n)`; \"\u2211 a\u2099 = L\" is `HasSum (fun n => a n) L`; a partial sum is `\u2211 k in Finset.range n, a k`. Do NOT confuse \"the series converges\" with \"the terms tend to 0\" \u2014 never render series convergence as `Tendsto (fun n => a n) atTop (nhds 0)`.\n- **Complex parts:** real/imaginary parts are `Complex.re` and `Complex.im`, or `re`/`im` after `open Complex`, or dot notation `(f z).im`. There is no `Im` or `Re` identifier.\n- **Unit circle / unit modulus:** there is no `Set.unitCircle` and no `Complex.unitCircle`. \"z lies on the unit circle\" is `\u2016z\u2016 = 1` or `z \u2208 Metric.sphere (0 : \u2102) 1`; \"|w| = 1\" is `\u2016w\u2016 = 1` (or `Complex.abs w = 1`).\n- **Real-to-complex coercion:** `Complex.ofReal r` or `(r : \u2102)`. In `z = r * w` with `r : \u211d` and `w : \u2102`, Lean inserts the coercion automatically, but writing `z = (r : \u2102) * w` is safest.\n- **No `ConstantOn`:** Mathlib has no `ConstantOn` predicate. Use `\u2203 c, \u2200 z \u2208 s, f z = c` (or `Set.EqOn f (fun _ => c) s`).\n- **Open maps:** \"f is an open map\" is `IsOpenMap f`. The product projections are `Prod.fst : X \u00d7 Y \u2192 X` and `Prod.snd : X \u00d7 Y \u2192 Y`. To state two claims in one theorem, conjoin them with `\u2227`.\n- **Quantifiers:** `\u2200 x \u2208 s, P x` and `\u2200 x > 0, P x` are valid.\n- **Number theory:** \"a is nonzero\" is `ha : a \u2260 0`. Parity conditions can be written `a % 2 = 0` (decidable, usable in an `if`) or `Even a` / `Odd a`. `gcd` works on `\u2124`.\n\n## Worked examples (corrected)\nProblem: \"Suppose f is differentiable for every x>0 and f'(x) \u2192 0 as x \u2192 +\u221e. Put g(x)=f(x+1)-f(x). Prove g(x) \u2192 0 as x \u2192 +\u221e.\" (opens include Topology Filter Real)\n```lean4\ntheorem g_converges_to_zero (f : \u211d \u2192 \u211d) (hf : \u2200 x > 0, DifferentiableAt \u211d f x)\n    (hlim : Tendsto (deriv f) atTop (nhds 0)) :\n    Tendsto (fun x => f (x + 1) - f x) atTop (nhds 0) := by sorry\n```\n\nProblem: \"Show that \u03c0\u2081 : X \u00d7 Y \u2192 X and \u03c0\u2082 : X \u00d7 Y \u2192 Y are open maps.\" (opens include Filter Set TopologicalSpace)\n```lean4\ntheorem projections_are_open_maps (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] :\n    IsOpenMap (Prod.fst : X \u00d7 Y \u2192 X) \u2227 IsOpenMap (Prod.snd : X \u00d7 Y \u2192 Y) := by sorry\n```\n\nProblem: \"Suppose f is holomorphic in an open set \u03a9. Prove that if Im(f) is constant, then f is constant.\" (opens include Complex Filter)\n```lean4\ntheorem constant_of_constant_imaginary_part (f : \u2102 \u2192 \u2102) (\u03a9 : Set \u2102) (h\u03a9 : IsOpen \u03a9)\n    (hf : DifferentiableOn \u2102 f \u03a9) (hIm : \u2203 c : \u211d, \u2200 z \u2208 \u03a9, (f z).im = c) :\n    \u2203 c : \u2102, \u2200 z \u2208 \u03a9, f z = c := by sorry\n```\n\nProblem: \"If T_\u03b1 is a family of topologies on X, show that \u22c3 T_\u03b1 does not need to be a topology on X.\" (context defines `is_topology`; opens include Filter Set TopologicalSpace)\nPitfalls avoided: a family needs an index type (`T : \u03b9 \u2192 Set (Set X)`, not `T : Set (Set X)` applied to `\u03b1`); \"does not need to be\" is an existential counterexample, not `\u2200 ... \u2192 \u00ac ...`.\n```lean4\ntheorem union_of_topologies_not_necessarily_a_topology :\n    \u2203 (X : Type) (\u03b9 : Type) (T : \u03b9 \u2192 Set (Set X)),\n      (\u2200 \u03b1, is_topology X (T \u03b1)) \u2227 \u00ac is_topology X (\u22c3 \u03b1, T \u03b1) := by sorry\n```\n\nProblem: \"If a is a nonzero integer, then for n > m show that (a^(2^n)+1, a^(2^m)+1) = 1 or 2 depending on whether a is odd or even.\" (opens include Real, scoped BigOperators)\nPitfall avoided: the \"nonzero\" hypothesis `ha : a \u2260 0` must appear.\n```lean4\ntheorem gcd_pow_two_pow_add_one (a : \u2124) (ha : a \u2260 0) (n m : \u2115) (h : n > m) :\n    gcd (a ^ (2 ^ n) + 1) (a ^ (2 ^ m) + 1) = if a % 2 = 0 then 1 else 2 := by sorry\n```\n\nProblem: \"Prove that the power series \u2211 z^n/n converges at every point of the unit circle except z = 1.\" (opens include Complex Filter Function Metric Finset; scoped BigOperators Topology)\nPitfalls avoided: no comma in `fun` binders; no `Set.unitCircle` (use `\u2016z\u2016 = 1`); series convergence is `Summable` of the actual terms `z ^ n / n`, not a limit of an invented `f`.\n```lean4\ntheorem summable_z_pow_div_n_on_unit_circle_ne_one :\n    \u2200 z : \u2102, \u2016z\u2016 = 1 \u2192 z \u2260 1 \u2192 Summable (fun n : \u2115 => z ^ n / n) := by sorry\n```\n\nProblem: \"Suppose (a) f is continuous for x \u2265 0, (b) f\u2032(x) exists for x > 0, (c) f(0)=0, (d) f\u2032 is monotonically increasing. Put g(x)=f(x)/x (x>0) and prove that g is monotonically increasing.\" (opens include Topology Filter Real Complex TopologicalSpace Finset; scoped BigOperators)\nPitfalls avoided: \"continuous for x \u2265 0\" is `ContinuousOn f (Set.Ici 0)` \u2014 NOT `Set.Icc 0 0`, which is the singleton {0} and would only give continuity at 0; since g is only defined for x > 0, the conclusion is `MonotoneOn ... (Set.Ioi 0)`, NOT `Monotone` over all of \u211d; likewise f\u2032's monotonicity is on (0,\u221e).\n```lean4\ntheorem g_is_monotonically_increasing (f : \u211d \u2192 \u211d) (hf_cont : ContinuousOn f (Set.Ici 0))\n    (hf_diff : \u2200 x > 0, DifferentiableAt \u211d f x) (hf0 : f 0 = 0)\n    (hderiv_monotone : MonotoneOn (deriv f) (Set.Ioi 0)) :\n    MonotoneOn (fun x => f x / x) (Set.Ioi 0) := by sorry\n```\n\nProblem: \"Show that X is countably compact if and only if every nested sequence C\u2081 \u2287 C\u2082 \u2287 \u22ef of closed nonempty sets of X has a nonempty intersection.\" (context defines `countably_compact`; opens include Filter Set TopologicalSpace; scoped Topology)\nPitfalls avoided: the indexed intersection is `\u22c2 i, C i` (iInter) \u2014 binary `\u2229` applied to a binder (`\u2229 i, C i`) is a syntax error; the conditions on the family are chained with nested `\u2192`, not a mixed `\u2227`/`\u2192` chain (which would push the conclusion inside the `\u2200`).\n```lean4\ntheorem countably_compact_iff_nested_closed_sets_intersect (X : Type*) [TopologicalSpace X] :\n    countably_compact X \u2194\n      \u2200 (C : \u2115 \u2192 Set X), (\u2200 i, IsClosed (C i)) \u2192 (\u2200 i, (C i).Nonempty) \u2192\n        (\u2200 i j, i \u2264 j \u2192 C j \u2286 C i) \u2192 (\u22c2 i, C i).Nonempty := by sorry\n```\n\nProblem: \"If z is a complex number, prove that there exists an r \u2265 0 and a complex number w with |w| = 1 such that z = rw.\" (opens include Topology Filter Real Complex TopologicalSpace Finset; scoped BigOperators)\nPitfalls avoided: there is no `Complex.unitCircle`; \"|w| = 1\" is `\u2016w\u2016 = 1`; the existence claim is a clean conjunction of the three required properties \u2014 do not try to construct the witness inside the statement.\n```lean4\ntheorem complex_number_polar_form (z : \u2102) :\n    \u2203 (r : \u211d) (w : \u2102), r \u2265 0 \u2227 \u2016w\u2016 = 1 \u2227 z = r * w := by sorry\n```\n\n## Final checklist before answering\n(a) Every identifier is either a bound variable, a definition from the context, or a real Mathlib name available under the given opens (no `Set.unitCircle`, no `Complex.unitCircle`, no `ConstantOn`, no `Im`/`Re`, no `f'`).\n(b) Syntax is valid Lean 4: `fun ... => ...` binders with NO comma, typeclasses in `[...]`, no invented notation; `\u22c2`/`\u22c3` (with binders) for indexed intersections/unions, binary `\u2229`/`\u222a` only between two sets; conditions on quantified families chained with `\u2192`, not mixed `\u2227`/`\u2192`.\n(c) ALL hypotheses of the problem appear (re-scan for \"nonzero\", \"positive\", strict inequalities) and the conclusion matches the problem, with each case value attached to the correct condition.\n(d) DOMAIN AUDIT: every property stated on a restricted domain uses the matching `...On` predicate with the right interval set (`Set.Ici` for \u2265, `Set.Ioi` for >, `Set.Iic` for \u2264, `Set.Iio` for <, `Set.Icc`/`Set.Ioo` for bounded intervals); nothing is quantified over a larger domain than the problem states \u2014 watch out for expressions undefined outside the domain, like `f x / x` at `x \u2264 0`, and remember `Set.Icc 0 0 = {0}`.\n(e) Indexed families use an index type (`T : \u03b9 \u2192 ...`); a `Set` is never applied to an index.\n(f) \"Not necessarily / does not need to be\" is `\u2203 ... \u2227 \u00ac ...`, not `\u2200 ... \u2192 \u00ac ...`.\n(g) Concrete objects from the problem (specific series, maps, numbers) are written out explicitly, not replaced by generic variables; existence claims list the required properties as conjuncts rather than inventing witness-constructor constants.\n(h) The statement ends with `:= by sorry` inside one ```lean4 code block."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.06)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.11)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.11)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.11)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.16)", fillcolor=cyan, tooltip=" "];
    5 [label="5\\n(0.13)", fillcolor=lightgray, tooltip=" "];
    6 [label="6\\n(0.11)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    1 -> 3;
    3 -> 4;
    4 -> 5;
    3 -> 6;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
