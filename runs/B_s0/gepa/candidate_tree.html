<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.0571, "parents": "seed", "role": "Pareto Front", "components": {"instructions": "Translate the following math problem into a single Lean 4 theorem statement using Mathlib. End the statement with `:= by sorry`. Put the final statement in a ```lean4 code block."}},
{"idx": 1, "score": 0.0429, "parents": "0", "role": "Pareto Front", "components": {"instructions": "Translate the given math problem into a single Lean 4 theorem statement using Mathlib.\n\n## Input format\nYou are given:\n1. A math problem stated in English/LaTeX.\n2. A \"Lean 4 context\": the exact `import`, `open`, `open scoped` (and possibly definition) lines that will be prepended before your theorem. Rely only on this context \u2014 do not add imports or opens, and do not repeat the context lines in your answer. Write exactly one theorem.\n\n## Output format\n- Output exactly one theorem inside a single ```lean4 code block.\n- The theorem must end with `:= by sorry` (no proof is required).\n- Give the theorem a descriptive snake_case name.\n\n## Grading criteria\n1. **Compilation**: the statement must compile under the given context with `autoImplicit = false`. Every identifier must be either bound in your theorem or an existing Mathlib name in scope; an unknown identifier is a hard error, never an auto-bound variable.\n2. **Faithfulness**: a judge compares your statement against the English text. A statement that compiles still fails if it drops, weakens, or alters any part of the problem.\n\n## Faithfulness rules\n- Include EVERY hypothesis from the English text as an explicit named argument. Examples: \"a is a nonzero integer\" \u2192 `(a : \u2124) (ha : a \u2260 0)`; \"for n > m\" \u2192 `(m n : \u2115) (h : m < n)`. Omitting a hypothesis (e.g. forgetting `ha : a \u2260 0`) is a classic faithfulness failure even when the statement compiles.\n- Reproduce the conclusion exactly, including case splits: \"\u2026 is 1 or 2 depending on whether a is odd or even\" can be encoded as `... = if a % 2 = 0 then 2 else 1`.\n- \"There exists a unique\" \u2192 `\u2203!`.\n- Map objects to the right types: integers `\u2124`, naturals `\u2115`, rationals `\u211a`, reals `\u211d`; a polynomial over \u211a is `Polynomial \u211a` with indeterminate `X`, e.g. `(X^3 + 6*X + 12 : Polynomial \u211a)`; \"irreducible in \u211a\" \u2192 `Irreducible (p : Polynomial \u211a)`.\n\n## Mathlib facts and compilation pitfalls\n- Topological closure is `closure` (lowercase). `Closure` does not exist and raises \"unknown identifier\".\n- Other exact names: `MetricSpace`, `CompleteSpace`, `UniformContinuous`, `Continuous`, `Irreducible`, `Polynomial`, `subset_closure` (of type `s \u2286 closure s`), `Set.inclusion` (of type `s \u2286 t \u2192 s \u2192 t`).\n- Subtypes and coercions: if `A : Set X` and `f : A \u2192 Y`, then `f` expects an element of the subtype `\u21a5A` (a pair `\u27e8x, hx\u27e9`), not a bare `x : X`; writing `f x` with `x : X` is a type mismatch. To express that `g : closure A \u2192 Y` extends `f`, write e.g.\n  `\u2200 x : A, g \u27e8x.1, subset_closure x.2\u27e9 = f x`\n  or `g \u2218 Set.inclusion subset_closure = f`.\n- `gcd` on `\u2124` (Mathlib's `GCDMonoid \u2124` instance) returns a non-negative `\u2124`, so it can be compared directly with the literals `1` and `2`.\n- Annotate types where literals are ambiguous, e.g. `(... : Polynomial \u211a)`; write multiplication explicitly as in `6*X`.\n- `MetricSpace X`, `CompleteSpace Y` etc. are typeclasses \u2014 supply them as instance arguments `[MetricSpace X]`.\n\n## Strategy\n1. Parse the problem into: variables with types, hypotheses, and conclusion.\n2. Introduce one named argument per variable and per hypothesis \u2014 never drop one.\n3. State the conclusion with precise Mathlib predicates (`\u2203!` for uniqueness, if-then-else for case splits).\n4. Mentally type-check every application, especially where subtypes/coercions are involved, and verify the exact spelling and capitalization of every identifier against Mathlib.\n5. Emit only the theorem in a ```lean4 code block ending with `:= by sorry`.\n\n## Worked examples\nProblem: \"Prove that $x^3 + 6x + 12$ is irreducible in $\\mathbb{Q}$.\"\nGood output:\n```lean4\ntheorem irreducible_x_cubed_plus_six_x_plus_twelve : Irreducible (X^3 + 6*X + 12 : Polynomial \u211a) := by sorry\n```\n\nProblem: \"If $a$ is a nonzero integer, then for $n>m$ show that $(a^{2^{n}}+1, a^{2^{m}}+1)=1$ or 2 depending on whether $a$ is odd or even.\"\nGood output (note the `ha : a \u2260 0` hypothesis \u2014 omitting it makes the statement unfaithful):\n```lean4\ntheorem gcd_power_two_exponents (a : \u2124) (ha : a \u2260 0) (m n : \u2115) (hm : m < n) :\n    gcd (a^(2^n) + 1) (a^(2^m) + 1) = if a % 2 = 0 then 2 else 1 := by sorry\n```\n\nProblem: \"Let $(X,d_X)$ and $(Y,d_Y)$ be metric spaces with $Y$ complete, and let $A \\subset X$. Show that a uniformly continuous $f : A \\to Y$ extends uniquely to a continuous $g : \\bar{A} \\to Y$, and $g$ is uniformly continuous.\"\nGood output (note lowercase `closure` and the subtype-correct extension condition):\n```lean4\ntheorem uniform_continuous_extension (X Y : Type) [MetricSpace X] [MetricSpace Y] [CompleteSpace Y]\n    (A : Set X) (f : A \u2192 Y) (hf : UniformContinuous f) :\n    \u2203! g : closure A \u2192 Y, Continuous g \u2227 UniformContinuous g \u2227\n      \u2200 x : A, g \u27e8x.1, subset_closure x.2\u27e9 = f x := by sorry\n```\n`"}},
{"idx": 2, "score": 0.0857, "parents": "0", "role": "Best", "components": {"instructions": "Translate the following math problem into a single Lean 4 theorem statement using Mathlib.\n\nYou are given a \"Lean 4 context\" (imports, opens, and possibly definitions). Your answer will be compiled with exactly that context prepended, with the `autoImplicit` option set to `false`. If it compiles, a judge then checks that the statement faithfully formalizes the original problem. A statement that does not compile scores 0, no matter how close the mathematics is.\n\nOutput requirements:\n- Output exactly one theorem declaration inside a single ```lean4 code block. Do not repeat the imports/opens, and do not include proofs, comments, or explanations. Choose any reasonable theorem name.\n- End the statement with `:= by sorry`.\n- Every identifier must be bound in the theorem or defined in Mathlib (reachable via the given opens). Unknown identifiers are hard errors because `autoImplicit` is false.\n- The statement must be a faithful translation: match the quantifier structure, hypotheses, and conclusion of the problem. Do not weaken or strengthen it, and do not introduce spurious variables. If the context provides definitions, use them where relevant.\n\nMathlib facts and pitfalls (each of these has caused a real compilation failure \u2014 check for them before finalizing):\n\n1. Spans and submodules\n   - The span of a set is `Submodule.span R s` (lowercase `span`, also available unqualified when `Submodule` is opened). There is NO identifier `Span`.\n   - The whole space viewed as a submodule is `(\u22a4 : Submodule F V)`; never use the type `V` itself where a `Submodule F V` is expected.\n   - \"Proper subspace\" is `W \u2260 \u22a4` (or `W < \u22a4`). Submodules do not support `\u2282` (there is no `HasSSubset (Submodule F V)` instance).\n   - To take a union of submodules as sets, coerce each one: `\u22c3 i, (W i : Set V)`; the whole carrier set is `Set.univ`.\n   - A family of subspaces indexed by `Fin n` is a function `W : Fin n \u2192 Submodule F V`; bind indices with `\u2200 i, ...` inside the proposition \u2014 do not existentially quantify a stray index `i : Fin n`.\n\n2. Linear independence of a set\n   - `LinearIndependent R v` expects a FUNCTION `v : \u03b9 \u2192 M`. For `S : Set M`, write `LinearIndependent R ((\u2191) : S \u2192 M)` (equivalently `LinearIndependent R (fun s : S => (s : M))`). Writing `LinearIndependent R S` directly makes Lean treat `S` as a map `M \u2192 Prop` and fails with `failed to synthesize instance AddCommMonoid Prop`.\n\n3. Countability\n   - For `S : Set \u03b1`, both `Countable S` (via coercion to the subtype `\u21a5S`) and `S.Countable` (`Set.Countable`) work. In Mathlib, `Countable` includes finite sets, so \"finite or countably infinite\" is expressed as just `Countable S`.\n   - \"V is spanned by a countable set\" is NOT a typeclass; state it as a named hypothesis, e.g. `(h : \u2203 s : Set V, Countable s \u2227 Submodule.span \u211a s = \u22a4)`.\n\n4. Existentials with side conditions\n   - Never write `\u2203 r : \u211d \u2265 0, ...`; Lean parses `\u211d \u2265 0` as a type and fails (`LE Type`, `OfNat Type 0` errors). Write `\u2203 r : \u211d, 0 \u2264 r \u2227 ...` instead. (The bounded-exists syntax `\u2203 r \u2265 0, ...` exists but cannot be combined with a type ascription.)\n\n5. Complex numbers\n   - The modulus of `w : \u2102` is `\u2016w\u2016` or `Complex.abs w`. The notation `|w|` does NOT work for `\u2102` (it requires a `Lattice \u2102` instance, which does not exist).\n   - For `r : \u211d` and `w : \u2102`, `r \u2022 w` works (\u2102 is an \u211d-module); alternatively cast: `(r : \u2102) * w`.\n\n6. Typeclasses vs. hypotheses\n   - Supply structure assumptions as instance arguments, e.g. `(F : Type) [Field F] [Infinite F] (V : Type) [AddCommGroup V] [Module F V]`; a vector space over \u211a needs `[AddCommGroup V] [Module \u211a V]`.\n   - Only genuine typeclasses go in `[]`; everything else (existential assumptions, equalities, etc.) goes in `()` as named hypotheses.\n\nCompilable reference patterns (adapt names and content to the actual problem):\n- `theorem ex1 (V : Type) [AddCommGroup V] [Module \u211a V] (h : \u2203 s : Set V, Countable s \u2227 Submodule.span \u211a s = \u22a4) : \u2200 S : Set V, LinearIndependent \u211a ((\u2191) : S \u2192 V) \u2192 Countable S := by sorry`\n- `theorem ex2 (z : \u2102) : \u2203 r : \u211d, 0 \u2264 r \u2227 \u2203 w : \u2102, \u2016w\u2016 = 1 \u2227 z = r \u2022 w := by sorry`\n- `theorem ex3 (F : Type) [Field F] [Infinite F] (V : Type) [AddCommGroup V] [Module F V] : \u2200 (n : \u2115) (W : Fin n \u2192 Submodule F V), (\u2200 i, W i \u2260 \u22a4) \u2192 (\u22c3 i, (W i : Set V)) \u2260 Set.univ := by sorry`\n\nFinal self-check before answering: (a) does every token resolve under the given opens? (b) does every notation's typeclass exist for the types at hand? (c) reading the formal statement back in English, does it say exactly what the problem says?\n`"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.06)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.04)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.09)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    0 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
