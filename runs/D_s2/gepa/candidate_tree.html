rent concept from the set of eigenvalues, and this substitution was judged unfaithful even though they coincide in finite dimensions.\n   - \"a complex number z is real\" \u2192 state realness directly, e.g. `\u2203 r : \u211d, z = r` \u2014 do NOT replace it with a different condition such as `z.im = 0`.\n   - \"T is a normal operator\" \u2192 `T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint`\n   - \"T is self-adjoint\" \u2192 `T = T.adjoint`\n\n3. **Encode the conclusion faithfully.**\n   - Case-dependent conclusions (\"the gcd is 1 or 2 depending on whether a is odd or even\") can be written with `if ... then ... else ...`, e.g. `Int.gcd ... ... = if Odd a then 1 else 2`.\n   - Negative claims may be expressed by exhibiting the failure of a defining axiom. Example: \"ZMod n is not a group under multiplication\" \u2192 `\u2203 a : ZMod n, \u00ac\u2203 b : ZMod n, a * b = 1` (some residue class has no multiplicative inverse). This was judged faithful.\n   - Inequalities may be written in either exact direction (n > m as `m < n` is fine), but no hypothesis may be dropped or added.\n\n4. **Verify consistency before finalizing.**\n   - *Compilation check:* every identifier must resolve under the given imports/opens; check namespaces, argument order, and insert needed coercions (e.g., `\u2191`, `(z : \u2102)`). The theorem must be well-typed.\n   - *Faithfulness check:* re-read the English statement and confirm a one-to-one correspondence with your formalization: no missing hypotheses, no extra assumptions, identical quantifier structure, identical mathematical concepts, identical conclusion. When in doubt, prefer the most literal formalization over a \"clever\" equivalent one.\n\n# Examples with feedback lessons\n\nExample (UNFAITHFUL, score 0): \"Prove that a normal operator on a complex inner-product space is self-adjoint if and only if all its eigenvalues are real.\"\nBad output:\n  theorem ... (T : V \u2192\u2097[\u2102] V) (h_normal : T.adjoint \u2218\u2097 T {"idx": 3, "score": 0.5857, "parents": "0", "role": "", "components": {"instructions": "You are given a mathematical problem stated in natural language, together with a Lean 4 context consisting of `import` statements, `open` / `open scoped` commands, and possibly auxiliary definitions. Your task is to translate the problem into exactly ONE Lean 4 theorem statement that faithfully captures the problem, and then verify (a) that the statement compiles and (b) that it is consistent with the natural-language problem. Think step by step before producing the final answer.\n\n## Input format\n- A natural-language math problem (prove/show/verify ...).\n- A \"Lean 4 context\" block with the exact imports, opens, and definitions you must use.\n\n## Output format\n- Use exactly the imports, opens, and definitions given in the context. Do not add, remove, or rename them. When the context provides a definition (e.g. `is_topology`), use it verbatim instead of inventing your own.\n- Write exactly one `theorem` (not `lemma`, `def`, or `example`) with a descriptive name.\n- The theorem must end with `:= by sorry`. Only the statement is being graded; the proof is intentionally omitted.\n- Output the theorem in a ```lean4 code block.\n\n## CRITICAL: the statement MUST compile\nThe most common failure mode is a parse/elaboration error, which scores 0 regardless of faithfulness. Check each of these before answering:\n\n1. **Never write a bare `let x := v` on its own line inside a theorem statement.** In term mode, `let x := v` must either be followed by `;` and the body on the same logical line (`let x := v; body`), or the body must be indented strictly more than the `let` keyword. A `let` whose body sits at the same indentation produces the error \"expected '{' or indented tactic sequence\" and leaves unsolved metavariable goals (`\u22a2 ?m._`).\n   - Safest option: avoid `let` in the statement entirely \u2014 inline the expression where it is used. For example, write\n     `MonotoneOn {"idx": 6, "score": 0.5429, "parents": "4", "role": "", "components": {"instructions": "Think step by step to translate the mathematical problem in natural language to Lean 4, and verify the consistency.\n\n# Task description\n\nYou will be given:\n1. A mathematical problem stated in natural language (possibly containing LaTeX).\n2. A \"Lean 4 context\" code block with the exact imports, `open` commands, and definitions you must use.\n\nYour job is to write exactly ONE Lean 4 theorem statement that faithfully formalizes the problem, using only the given context. Do NOT attempt a proof \u2014 end the theorem with `:= by sorry`. Output the theorem inside a single ```lean4 code block, with no extra imports or opens.\n\nYour output is judged on two criteria, IN THIS ORDER:\n- **Compilation**: the statement must type-check under exactly the given context. If it does not compile, the score is 0 and faithfulness is never checked. Most observed failures were compilation failures \u2014 treat compilation as the primary risk.\n- **Faithfulness**: the statement must correspond exactly to the English claim \u2014 same objects, same hypotheses, same quantifiers, same predicates, same conclusion. Substituting a merely equivalent or related concept for the stated one counts as UNFAITHFUL (score 0).\n\n# Step-by-step procedure\n\n1. **Parse the English problem.** List:\n   - Every variable and its type (integer, natural number, linear operator, real function, set, etc.).\n   - Every hypothesis/condition (e.g., \"a is nonzero\", \"n > m\", \"T is normal\", \"n > 1\", \"f is differentiable for every x > 0\"). Each must appear in the theorem, as an explicit hypothesis or an exact encoding.\n   - The conclusion's logical structure: quantifiers (\u2200, \u2203), negations, and case distinctions (\"... or ... depending on whether ...\").\n   - Any auxiliary objects the problem defines by name (e.g. \"Put g(x) = f(x+1) \u2212 f(x)\"). These must be inlined into the conclusion as lambda terms \u2014 see step 3.\n\n2. **Map each concept to the precise Mathlib definition.** Known mappings:\n   - \u2124/n\u2124 (residue classes) \u2192 `ZMod n`\n   - gcd of two integers \u2192 `Int.gcd x y` (note: it returns a `\u2115`, so `Int.gcd x y = 1` is a `\u2115`-valued equality \u2014 that is correct as written)\n   - \"a is odd / even\" \u2192 `Odd a` / `Even a`\n   - \"z is an eigenvalue of a linear map T\" \u2192 `Module.End.HasEigenvalue T z` \u2014 do NOT use `z \u2208 spectrum \u2102 T`; the spectrum is a different concept from the set of eigenvalues, and this substitution was judged unfaithful even though they coincide in finite dimensions.\n   - \"a complex number z is real\" \u2192 state realness directly, e.g. `\u2203 r : \u211d, z = r` \u2014 do NOT replace it with a different condition such as `z.im = 0`.\n   - \"T is a normal operator\" \u2192 `T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint`\n   - \"T is self-adjoint\" \u2192 `T = T.adjoint`\n   - modulus of a complex number, |z| \u2192 `\u2016z\u2016` (the norm). WARNING: `Complex.abs` does NOT exist \u2014 writing it is an \"unknown constant\" compile error. (For |z|\u00b2 you may use `Complex.normSq z`.)\n   - Euler's \u03c6-function, \u03c6(N) \u2192 `Nat.totient N` (a `\u2115`; coerce with `(Nat.totient N : \u2124)` wherever an integer is required, e.g. as a modulus)\n   - integer congruence \"a \u2261 b (mod n)\" \u2192 `a \u2261 b [ZMOD (n : \u2124)]` (`Int.ModEq`); the modulus must be an integer, so coerce natural moduli explicitly\n   - \"M and N are relatively prime\" \u2192 `Int.gcd M N = 1`\n   - limsup of a sequence \u2192 `Filter.limsup u Filter.atTop`; if the context defines a `local notation \"limsup\"`, you MUST use that notation verbatim, with an argument of the type it expects.\n   - \"U is an open set\" \u2192 `IsOpen U`\n   - \"an at most countable collection\" / \"a countable union\" \u2192 use the predicate `Set.Countable S` for a set `S` (or a `[Countable \u03b9]` instance for an index type). WARNING: `\u2135\u2080` is an UNKNOWN IDENTIFIER \u2014 writing it is an \"unknown identifier\" compile error (`autoImplicit` is false, so it cannot be auto-bound). `Cardinal.aleph 0` exists but is a `Cardinal`, which does NOT type-check against `Set.encard S` (that returns `\u2115\u221e`) \u2014 do not write `Set.encard S \u2264 Cardinal.aleph 0` either. `S.Countable` is the correct, compiling encoding of \"at most countable\". In general, express size restrictions with Mathlib's predicate classes (`Set.Countable`, `Set.Finite`, `Countable`, `Finite`) rather than with cardinal numbers.\n   - \"disjoint segments / intervals\" \u2192 `Disjoint (Set.Ioo a b) (Set.Ioo c d)`. A family of open intervals indexed by a set of endpoint-pairs can be written `\u22c3 p \u2208 S, Set.Ioo p.1 p.2`, with pairwise disjointness as `\u2200 p \u2208 S, \u2200 q \u2208 S, p \u2260 q \u2192 Disjoint (Set.Ioo p.1 p.2) (Set.Ioo q.1 q.2)` (or `S.PairwiseDisjoint (fun p => Set.Ioo p.1 p.2)`).\n   - \"f is differentiable for every x > 0\" \u2192 `DifferentiableOn \u211d f (Set.Ioi 0)` (for `f : \u211d \u2192 \u211d`)\n   - \"f\u2032(x) \u2192 L as x \u2192 +\u221e\" \u2192 `Filter.Tendsto (deriv f) Filter.atTop (nhds L)`; `deriv f` is the derivative function of `f : \u211d \u2192 \u211d`.\n   - \"g(x) \u2192 L as x \u2192 +\u221e\" \u2192 `Filter.Tendsto g Filter.atTop (nhds L)`\n   - \"R is an integral domain\" \u2192 `IsDomain R`. This applies directly to `R : Subring F` \u2014 a subring already carries the ring structure and contains the identity by definition, so \"subring of a field which contains the identity\" needs NO extra hypothesis beyond `(R : Subring F)`.\n\n3. **Encode the conclusion faithfully.**\n   - Case-dependent conclusions (\"the gcd is 1 or 2 depending on whether a is odd or even\") can be written with `if ... then ... else ...`, e.g. `Int.gcd ... ... = if Odd a then 1 else 2`.\n   - Negative claims may be expressed by exhibiting the failure of a f the theorem or (b) an existing constant from the context/Mathlib. An unbound identifier (e.g. `\u2135\u2080`, or a `g` that was never introduced) is an \"unknown identifier\" compile error.\n   - *Syntax check:* after the colon, the statement must be ONE well-formed term. A `let x := v` line followed by a body is NOT accepted in statement position (parse error: \"expected '{' or indented tactic sequence\"). Inline all auxiliary definitions as lambdas.\n   - *Typeclass check:* does every required instance exist for your concrete types?\n     - `x ^ n` needs an `HPow` instance. There is NO `HPow \u2124 \u2124`: an integer base only supports NATURAL exponents (`x ^ n` with `n : \u2115`). Integer exponents (`zpow`) exist only for bases that are multiplicative groups (e.g. `\u211d`, `\u2102`, `\u211a`) \u2014 never for `\u2124`. In number-theory problems, declare exponents as `\u2115` and coerce to `\u2124` where the surrounding statement needs integers (e.g. inside `Int.ModEq` or `Int.gcd`).\n     - `\u22a4` / `\u22a5` need `Top` / `Bot` instances. These do NOT exist for `\u211d` or `\u2124` \u2014 writing `= \u22a4` on a real-valued expression is a compile error. They DO exist for `EReal` and `ENNReal` (`\u211d\u22650\u221e`). For limsup/liminf statements about real sequences, coerce terms into `EReal`: `(a n : EReal)`.\n     - `\u2016x\u2016` needs a `Norm` instance (available for `\u2102`, `\u211d`, and normed spaces).\n   - *Coercion check:* insert explicit coercions between `\u2115`/`\u2124`/`\u211d`/`\u2102`/`EReal` wherever types must match: `(N : \u2124)`, `(Nat.totient N : \u2124)`, `(d : \u2124)`, `(a n : EReal)`, `(r : \u2102) * w`. Do not rely on automatic coercion insertion.\n   - *Context check:* if the context provides a `local notation` or auxiliary definition, use it EXACTLY as given \u2014 it is a strong signal of the intended encoding (e.g. a provided `limsup` notation for `\u2115 \u2192 EReal` tells you to coerce real sequences into `EReal` and to {"idx": 7, "score": 0.5857, "parents": "4", "role": "", "components": {"instructions": "Think step by step to translate the mathematical problem in natural language to Lean 4, and verify the consistency.\n\n# Task description\n\nYou will be given:\n1. A mathematical problem stated in natural language (possibly containing LaTeX).\n2. A \"Lean 4 context\" code block with the exact imports, `open` commands, and definitions you must use.\n\nYour job is to write exactly ONE Lean 4 theorem statement that faithfully formalizes the problem, using only the given context. Do NOT attempt a proof \u2014 end the theorem with `:= by sorry`. Output the theorem inside a single ```lean4 code block, with no extra imports or opens.\n\nYour output is judged on two criteria, IN THIS ORDER:\n- **Compilation**: the statement must type-check under exactly the given context. If it does not compile, the score is 0 and faithfulness is never checked. Most observed failures were compilation failures \u2014 treat compilation as the primary risk.\n- **Faithfulness**: the statement must correspond exactly to the English claim \u2014 same objects, same hypotheses, same quantifiers, same predicates, same conclusion. Substituting a merely equivalent or related concept for the stated one counts as UNFAITHFUL (score 0).\n\n# General strategy (observed to work)\n\n- Translate the English sentence structure one-to-one: every \"Let X be a ...\" becomes a variable (types as `Type*`, implicit `{X : Type*}` or explicit `(X : Type*)` both work), with structure carried by typeclass arguments in `[...]`; every condition (\"where p is prime\", \"f is continuous\", \"P is dense\") becomes a named hypothesis or instance argument; the \"Prove/Show that ...\" clause becomes the conclusion with identical quantifier structure. Hypothesis names are your choice (e.g. `hf`, `hP`, `hq_irreducible`).\n- Use idiomatic shapes known to compile: `\u2200 p \u2208 P, ...` for quantification over a set; `\u00ac\u2203 S : Finset ..., ...` for \"there is no finite collection ...\"; `A \u2227 B` for two-part conclusions.\n- Prefer primitives that require NO typeclass synthesis when synthesis is doubtful (e.g. `Nat.card` instead of `Fintype.card` for quotient types).\n- Fully-qualified names (`Set.univ`, `Ideal.span`, `Polynomial F`, `Finset`, `Nat.card`, `Int.gcd`) are always safe regardless of the given `open`s.\n\n# Step-by-step procedure\n\n1. **Parse the English problem.** List:\n   - Every variable and its type (integer, natural number, set, function, polynomial, vector space, etc.).\n   - Every hypothesis/condition (e.g., \"a is nonzero\", \"p is prime\", \"f is continuous\", \"P is dense\", \"T is normal\", \"n > 1\"). Each must appear in the theorem, as an explicit hypothesis, instance argument, or exact encoding.\n   - The conclusion's logical structure: quantifiers (\u2200, \u2203), negations, conjunctions, and case distinctions (\"... or ... depending on whether ...\").\n\n2. **Map each concept to the precise Mathlib definition.** Known mappings:\n\n   **Topology / metric spaces**\n   - metric space \u2192 `(X : Type*) [MetricSpace X]` (a `MetricSpace` instance also provides the `TopologicalSpace` needed by `Continuous` and `Dense`)\n   - \"f is a continuous mapping of X into Y\" \u2192 `(f : X \u2192 Y) (hf : Continuous f)`\n   - \"P is a dense subset of X\" \u2192 `(P : Set X) (hP : Dense P)`\n   - \"g(p) = f(p) for all p \u2208 P\" \u2192 `\u2200 p \u2208 P, g p = f p`; \"for all p \u2208 X\" \u2192 `\u2200 p : X, ...`\n\n   **Algebra: prime fields, polynomials, quotients**\n   - the field \u2124/p\u2124 with p prime \u2192 `ZMod p` together with an instance argument `[Fact (Nat.Prime p)]` (this is what makes `ZMod p` a field)\n   - polynomial ring over F \u2192 `Polynomial F`\n   - \"q is irreducible\" \u2192 `Irreducible q`\n   - \"q has degree n\" \u2192 `q.natDegree = n`\n   - quotient ring F[x]/(q(x)) \u2192 `Polynomial F \u29f8 Ideal.span {q}`\n   - \"R is a field\" (for a ring not a priori a field) \u2192 `IsField R`\n   - \"has exactly k elements\" (cardinality of a type) \u2192 `Nat.card \u03b1 = k`. WARNING: do NOT use `Fintype.card \u03b1` unless a `Fintype \u03b1` instance is automatically synthesizable. For quotient types such as `Polynomial (ZMod p) \u29f8 Ideal.span {q}`, Lean CANNOT synthesize `Fintype`, and `Fintype.card` fails with `failed to synthesize instance Fintype ...`. `Nat.card` is defined for EVERY type with no instance requirement, so it always compiles.\n\n   **Linear algebra**\n   - vector space over a field \u2192 `(F : Type*) [Field F] (V : Type*) [AddCommGroup V] [Module F V]`\n   - \"F is an infinite field\" \u2192 `[Infinite F]`\n   - subspace \u2192 `Submodule F V`\n   - \"proper subspace\" \u2192 `s \u2260 \u22a4` (submodules form a complete lattice, so `\u22a4` exists here \u2014 unlike for `\u211d`)\n   - \"finitely many subspaces\" \u2192 `S : Finset (Submodule F V)`\n   - \"the union of the subspaces\" \u2192 `\u22c3 s \u2208 S, (s : Set V)` \u2014 coerce each submodule to a set with `(s : Set V)`\n   - \"the union is all of V\" \u2192 `... = Set.univ`\n   - \"z is an eigenvalue of a linear map T\" \u2192 `Module.End.HasEigenvalue T z` \u2014 do NOT use `z \u2208 spectrum \u2102 T`; the spectrum is a different concept from the set of eigenvalues, and this substitution was judged unfaithful even though they coincide in finite dimensions.\n   - \"T is a normal operator\" \u2192 `T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint`\n   - \"T is self-adjoint\" \u2192 `T = T.adjoint`\n\n   **Number theory**\n   - \u2124/n\u2124 (residue classes) \u2192 `ZMod n`\n   - gcd of two integers \u2192 `Int.gcd x y` (note: it returns a `\u2115`, so `Int.gcd x y = 1` is a `\u2115`-valued equality \u2014 that is correct as written)\n   - \"a is odd / even\" \u2192 `Odd a` / `Even a`\n   - Euler's \u03c6-function, \u03c6(N) \u2192 `Nat.totient N` (a `\u2115`; coerce with `(Nat.totient N : \u2124)` wherever an integer {"idx": 8, "score": 0.6, "parents": "5", "role": "Best", "components": {"instructions": "You are given a mathematical problem stated in natural language, together with a Lean 4 context consisting of `import` statements, `open` / `open scoped` commands, and possibly auxiliary definitions. Your task is to translate the problem into exactly ONE Lean 4 theorem statement that faithfully captures the problem, and then verify (a) that the statement compiles and (b) that it is consistent with the natural-language problem. Think step by step before producing the final answer.\n\n## Input format\n- A natural-language math problem (prove/show/verify ...).\n- A \"Lean 4 context\" block with the exact imports, opens, and definitions you must use.\n\n## Output format\n- Use exactly the imports, opens, and definitions given in the context. Do not add, remove, or rename them. When the context provides a definition (e.g. `is_topology`), use it verbatim instead of inventing your own.\n- Write exactly one `theorem` (not `lemma`, `def`, or `example`) with a descriptive name.\n- The theorem must end with `:= by sorry`. Only the statement is being graded; the proof is intentionally omitted.\n- Output the theorem in a ```lean4 code block.\n\n## CRITICAL: the statement MUST compile\nA parse or elaboration error scores 0 regardless of faithfulness. Check ALL of the following before answering:\n\n1. **Never use a reserved token or keyword as a binder/variable name.** The most dangerous case is `\u03bb`: it is a reserved token (lambda abstraction), so writing `\u2200 \u03bb : F, ...` or `(\u03bb : F)` fails with the parse error `unexpected token '\u03bb'; expected '(', '[', '_', '{' or identifier`. When the natural-language problem uses \u03bb (e.g. an eigenvalue or a scalar parameter), rename it to `\u03bc`, `l`, or `lam`. All other Greek letters (\u03b1 \u03b2 \u03b3 \u03bc \u03bd \u03b5 \u03b9 \u03c1 \u03c3 \u03c4 \u03c6 \u03c7 \u03c8 \u03c9) are fine as identifiers. Also never use keyword s constructor `(\u27e8a, b\u27e9 : GaussianInt)`.\n   - If you are unsure whether a name like `Foo.bar` exists, reformulate using primitives you are certain of (anonymous constructors `\u27e8...\u27e9`, arithmetic operations, quantifiers, and the standard predicates listed below) instead of guessing.\n   - Divisibility in a ring `R` is written `(a : R) \u2223 b` (typed `\\dvd`).\n\n6. **Subtype coherence: never apply a function defined on one subtype to an argument of a different subtype.** If `g : {x : X // x \u2208 closure A} \u2192 Y` and `a : {x : X // x \u2208 A}`, then `g a` fails with \"Application type mismatch\", even though mathematically `A \u2286 closure A`. Lean does not insert this inclusion automatically. Fixes:\n   - Insert the inclusion term explicitly: `g \u27e8a, subset_closure a.property\u27e9`; or\n   - Re-quantify over the base type: `\u2200 (x : X) (hx : x \u2208 A), g \u27e8x, subset_closure hx\u27e9 = f \u27e8x, hx\u27e9`.\n   - The standard fact is `subset_closure : A \u2286 closure A`.\n   - Even safer: avoid subtypes altogether. Take functions on the whole ambient type and restrict them with predicates: `ContinuousOn f s`, `UniformContinuousOn f s`, `DifferentiableOn \u211d f s`, `MonotoneOn f s`, `Set.EqOn f g s`, and quantifiers `\u2200 x \u2208 s, ...`.\n\n7. **Ensure the statement is one complete `Prop`** with no dangling metavariables, balanced parentheses, and correct indentation, followed by `:= by sorry`.\n\n## General strategy: prefer predicates and quantifiers over heavy machinery\nStatements that unfold mathematical objects into quantified predicates over ambient types compile far more reliably than statements built from subtypes, submodules, or specialized structures. For example, \"null(T \u2212 \u03bbI) is invariant under S\" is safest stated as `\u2200 v : V, (T - \u03bc \u2022 LinearMap.id) v = 0 \u2192 (T - \u03bc \u2022 LinearMap.id) (S v) = 0` rather than via `LinearMap.ker` and submodule maps. Similarly, prefer `MonotoneOn`/`ContinuousOn`/`Set.EqOn` over subtypes, and `\u2203!` with explicit agreement conditions over uniqueness of total functions.\n\n## Faithfulness requirements\n- Include EVERY hypothesis of the natural-language problem as a separate named hypothesis, using standard Mathlib predicates. Typical translations:\n  - \"f is continuous for x \u2265 0\" \u2192 `(hcont : ContinuousOn f (Set.Ici 0))`\n  - \"f'(x) exists for x > 0\" \u2192 `(hdiff : DifferentiableOn \u211d f (Set.Ioi 0))`\n  - \"f(0) = 0\" \u2192 `(hf0 : f 0 = 0)`\n  - \"f' is monotonically increasing\" \u2192 `(hmono : MonotoneOn (deriv f) (Set.Ioi 0))`\n  - \"n is a squarefree integer greater than 3\" \u2192 `(n : \u2115) (hn_sq : Squarefree n) (hn_gt : n > 3)`\n  - \"(X, d_X) and (Y, d_Y) are metric spaces, Y complete\" \u2192 `(X Y : Type*) [MetricSpace X] [MetricSpace Y] [CompleteSpace Y]`\n  - \"A \u2286 X\" \u2192 `(A : Set X)`; the closure of A \u2192 `closure A`\n  - \"f : A \u2192 Y is uniformly continuous\" \u2192 either `(f : {a : X // a \u2208 A} \u2192 Y) (hf : UniformContinuous f)` or `(f : X \u2192 Y) (hf : UniformContinuousOn f A)`\n- Group theory translations:\n  - \"G is a group\", \"x is an element of G\" \u2192 `(G : Type*) [Group G] (x : G)`\n  - \"|x| = n\" (the order of x equals n) \u2192 `(h : orderOf x = n)`. `orderOf : G \u2192 \u2115` is Mathlib's name for the order of a group element (it is 0 for elements of infinite order, which is why the positivity hypothesis matters).\n  - \"for some positive integer n\" \u2192 `(n : \u2115) (hn : n > 0)`\n  - `x\u207b\u00b9` and `x^(n-1)` typecheck directly in any `Group`. Note `n - 1` is truncated natural subtraction, but with the hypothesis `n > 0` it matches the mathematics, so write it directly.\n- Linear algebra translations (vector spaces and linear operators):\n  - \"V is a vector space over F\" \u2192 `{F V : Type*} [Field F] [AddCommGroup V] [Module F V]`\n  - \"S, T \u2208 L(V)\" (S, T are linear operators on V) \u2192 `(S T : V const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
