<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>

</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.5714, "parents": "seed", "role": "Best", "components": {"instructions": "Think step by step to translate the mathematical problem in natural language to Lean 4, and verify the consistency."}},
{"idx": 1, "score": 0.5, "parents": "0", "role": "Pareto Front", "components": {"instructions": "Think step by step to translate the mathematical problem in natural language to Lean 4, and verify the consistency.\n\n# Task description\n\nYou will be given:\n1. A mathematical problem stated in natural language (possibly containing LaTeX).\n2. A \"Lean 4 context\" code block with the exact imports, `open` commands, and definitions you must use.\n\nYour job is to write exactly ONE Lean 4 theorem statement that faithfully formalizes the problem, using only the given context. Do NOT attempt a proof \u2014 end the theorem with `:= by sorry`. Output the theorem inside a single ```lean4 code block, with no extra imports or opens.\n\nYour output is judged on two criteria:\n- **Compilation**: the statement must type-check under exactly the given context.\n- **Faithfulness**: the statement must correspond exactly to the English claim \u2014 same objects, same hypotheses, same quantifiers, same predicates, same conclusion. Substituting a merely equivalent or related concept for the stated one counts as UNFAITHFUL (score 0).\n\n# Step-by-step procedure\n\n1. **Parse the English problem.** List:\n   - Every variable and its type (integer, natural number, linear operator, etc.).\n   - Every hypothesis/condition (e.g., \"a is nonzero\", \"n > m\", \"T is normal\", \"n > 1\"). Each must appear in the theorem, as an explicit hypothesis or an exact encoding.\n   - The conclusion's logical structure: quantifiers (\u2200, \u2203), negations, and case distinctions (\"... or ... depending on whether ...\").\n\n2. **Map each concept to the precise Mathlib definition.** Known mappings:\n   - \u2124/n\u2124 (residue classes) \u2192 `ZMod n`\n   - gcd of two integers \u2192 `Int.gcd x y`\n   - \"a is odd / even\" \u2192 `Odd a` / `Even a`\n   - \"z is an eigenvalue of a linear map T\" \u2192 `Module.End.HasEigenvalue T z` \u2014 do NOT use `z \u2208 spectrum \u2102 T`; the spectrum is a different concept from the set of eigenvalues, and this substitution was judged unfaithful even though they coincide in finite dimensions.\n   - \"a complex number z is real\" \u2192 state realness directly, e.g. `\u2203 r : \u211d, z = r` \u2014 do NOT replace it with a different condition such as `z.im = 0`.\n   - \"T is a normal operator\" \u2192 `T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint`\n   - \"T is self-adjoint\" \u2192 `T = T.adjoint`\n\n3. **Encode the conclusion faithfully.**\n   - Case-dependent conclusions (\"the gcd is 1 or 2 depending on whether a is odd or even\") can be written with `if ... then ... else ...`, e.g. `Int.gcd ... ... = if Odd a then 1 else 2`.\n   - Negative claims may be expressed by exhibiting the failure of a defining axiom. Example: \"ZMod n is not a group under multiplication\" \u2192 `\u2203 a : ZMod n, \u00ac\u2203 b : ZMod n, a * b = 1` (some residue class has no multiplicative inverse). This was judged faithful.\n   - Inequalities may be written in either exact direction (n > m as `m < n` is fine), but no hypothesis may be dropped or added.\n\n4. **Verify consistency before finalizing.**\n   - *Compilation check:* every identifier must resolve under the given imports/opens; check namespaces, argument order, and insert needed coercions (e.g., `\u2191`, `(z : \u2102)`). The theorem must be well-typed.\n   - *Faithfulness check:* re-read the English statement and confirm a one-to-one correspondence with your formalization: no missing hypotheses, no extra assumptions, identical quantifier structure, identical mathematical concepts, identical conclusion. When in doubt, prefer the most literal formalization over a \"clever\" equivalent one.\n\n# Examples with feedback lessons\n\nExample (UNFAITHFUL, score 0): \"Prove that a normal operator on a complex inner-product space is self-adjoint if and only if all its eigenvalues are real.\"\nBad output:\n  theorem ... (T : V \u2192\u2097[\u2102] V) (h_normal : T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint) :\n    (T = T.adjoint) \u2194 (\u2200 z : \u2102, z \u2208 spectrum \u2102 T \u2192 z.im = 0) := by sorry\nWhy it failed: it quantifies over the whole spectrum instead of eigenvalues, and uses `z.im = 0` instead of stating the eigenvalues are real. Fix: quantify with `Module.End.HasEigenvalue T z` and conclude `\u2203 r : \u211d, z = r`.\n\nExample (FAITHFUL, score 1): \"If a is a nonzero integer, then for n>m show that (a^(2^n)+1, a^(2^m)+1) = 1 or 2 depending on whether a is odd or even.\"\nGood output:\n  theorem gcd_power_of_two_plus_one (a : \u2124) (ha : a \u2260 0) (n m : \u2115) (h : m < n) :\n    Int.gcd (a^(2^n) + 1) (a^(2^m) + 1) = if Odd a then 1 else 2 := by sorry\nWhy it passed: all hypotheses present (nonzero, m < n), same gcd expression, case distinction captured by `if Odd a then 1 else 2`.\n\nExample (FAITHFUL, score 1): \"Prove that for all n>1, \u2124/n\u2124 is not a group under multiplication of residue classes.\"\nGood output:\n  theorem residue_class_multiplication_not_group (n : \u2115) (hn : n > 1) :\n    \u2203 a : ZMod n, \u00ac\u2203 b : ZMod n, a * b = 1 := by sorry\nWhy it passed: arbitrary n with n > 1, and \"not a group under multiplication\" correctly encoded as the existence of an element with no multiplicative inverse.\n\n# Output format\n\nReturn exactly one theorem in one ```lean4 code block, ending with `:= by sorry`. No additional imports, opens, definitions, or proofs."}},
{"idx": 2, "score": 0.5, "parents": "1", "role": "Pareto Front", "components": {"instructions": "Think step by step to translate the mathematical problem in natural language to Lean 4, and verify the consistency.\n\n# Task description\n\nYou will be given:\n1. A mathematical problem stated in natural language (possibly containing LaTeX).\n2. A \"Lean 4 context\" code block with the exact imports, `open` commands, and definitions you must use.\n\nYour job is to write exactly ONE Lean 4 theorem statement that faithfully formalizes the problem, using only the given context. Do NOT attempt a proof \u2014 end the theorem with `:= by sorry`. Output the theorem inside a single ```lean4 code block, with no extra imports or opens.\n\nYour output is judged on two criteria, in this order:\n- **Compilation**: the statement must type-check under exactly the given context. If it does not compile, the score is 0 and faithfulness is never even checked.\n- **Faithfulness**: the statement must correspond exactly to the English claim \u2014 same objects, same hypotheses, same quantifiers, same predicates, same conclusion. Substituting a merely equivalent or related concept for the stated one counts as UNFAITHFUL (score 0).\n\n# Step-by-step procedure\n\n1. **Parse the English problem.** List:\n   - Every variable and its type (integer, natural number, linear operator, subgroup, etc.).\n   - Every hypothesis/condition (e.g., \"a is nonzero\", \"n > m\", \"T is normal\", \"H \u2264 K\", \"p is an odd prime\"). Each must appear in the theorem, as an explicit hypothesis or an exact encoding.\n   - The conclusion's logical structure: quantifiers (\u2200, \u2203), negations, and case distinctions (\"... or ... depending on whether ...\").\n   - Phrases like \"do not assume G is finite\" mean: do NOT add `Fintype`/`Finite` hypotheses or instances. (`Subgroup.index` returns a `\u2115` and is defined for arbitrary groups, so index statements need no finiteness assumption.)\n\n2. **Scan the context definitions first.** Any `def` provided in the context (e.g. `noncomputable def Subgroup.relindex ...`) was placed there because the concept it names is needed for the problem and is not directly (or conveniently) available in Mathlib. Match each such definition to a concept in the English problem and use it VERBATIM \u2014 exact name, exact argument order. Never replace it with invented notation.\n\n3. **Map each concept to the precise Mathlib definition.** Known mappings:\n   - \u2124/n\u2124 (residue classes) \u2192 `ZMod n`\n   - gcd of two integers \u2192 `Int.gcd x y`\n   - \"a is odd / even\" \u2192 `Odd a` / `Even a`\n   - \"z is an eigenvalue of a linear map T\" \u2192 `Module.End.HasEigenvalue T z` \u2014 do NOT use `z \u2208 spectrum \u2102 T`; the spectrum is a different concept from the set of eigenvalues, and this substitution was judged unfaithful even though they coincide in finite dimensions.\n   - \"a complex number z is real\" \u2192 state realness directly, e.g. `\u2203 r : \u211d, z = r` \u2014 do NOT replace it with a different condition such as `z.im = 0`.\n   - \"T is a normal operator\" \u2192 `T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint`\n   - \"T is self-adjoint\" \u2192 `T = T.adjoint`\n   - \"x and y are conjugate elements in a group\" \u2192 `\u2203 g : G, x = g * y * g\u207b\u00b9` (judged faithful).\n   - \"|G : H|, the index of a subgroup H in G\" \u2192 `H.index` (i.e. `Subgroup.index H`), a `\u2115`; valid for infinite groups too.\n   - \"|K : H|, the relative index, for H \u2264 K \u2264 G\" \u2192 use the context-provided `Subgroup.relindex H K` (defined as `H.relIndex K`). Mind the argument order: `relindex H K` means |K : H|.\n   - Index multiplicativity \"|G:H| = |G:K| \u00b7 |K:H|\" \u2192 `H.index = K.index * Subgroup.relindex H K`.\n   - Finite sums like \"1 + 1/2 + ... + 1/(p\u22121)\" \u2192 `\u2211 i \u2208 Finset.Icc 1 (p - 1), (1 : \u211a) / i` (requires `open scoped BigOperators`, already in the context).\n   - \"p \u2223 a\" where p is a natural prime and a an integer \u2192 `(p : \u2124) \u2223 a` (coerce p).\n   - \"p is an odd prime\" \u2192 two separate hypotheses: `(hp_prime : Nat.Prime p) (hp_odd : Odd p)`.\n   - \"a/b where a, b are integers\" (a rational number) \u2192 `(a : \u211a) / (b : \u211a)`, with hypothesis `(hb : b \u2260 0)`.\n\n4. **Encode the conclusion faithfully.**\n   - Case-dependent conclusions (\"the gcd is 1 or 2 depending on whether a is odd or even\") can be written with `if ... then ... else ...`, e.g. `Int.gcd ... ... = if Odd a then 1 else 2`.\n   - Negative claims may be expressed by exhibiting the failure of a defining axiom. Example: \"ZMod n is not a group under multiplication\" \u2192 `\u2203 a : ZMod n, \u00ac\u2203 b : ZMod n, a * b = 1` (some residue class has no multiplicative inverse). This was judged faithful.\n   - Inequalities may be written in either exact direction (n > m as `m < n` is fine), but no hypothesis may be dropped or added.\n\n5. **Verify consistency before finalizing.**\n   - *Compilation check:* mentally type-check the statement token by token:\n     - Every identifier must resolve under the given imports/opens; check namespaces, argument order, and insert needed coercions (e.g., `\u2191`, `(z : \u2102)`, `(p : \u2124)`, `(a : \u211a)`, `(1 : \u211a) / i`).\n     - Every notation must have the required **type class instance** for the concrete types involved. Past failure: `H / K` on subgroups triggers `failed to synthesize instance of type class HDiv (Subgroup G) (Subgroup G)` \u2014 there is no division of subgroups. If a natural-looking notation has no instance, use the context-provided definition instead.\n     - **Big operators:** write binders with `\u2208`, e.g. `\u2211 i \u2208 Finset.Icc 1 (p - 1), (1 : \u211a) / i`. Do NOT write `\u2211 i in ...` \u2014 in the grading environment it fails with `error: unexpected token 'in'; expected ','`.\n     - A single unresolved identifier, missing instance, or syntax error means score 0.\n   - *Faithfulness check:* re-read the English statement and confirm a one-to-one correspondence with your formalization: no missing hypotheses, no extra assumptions, identical quantifier structure, identical mathematical concepts, identical conclusion. When in doubt, prefer the most literal formalization over a \"clever\" equivalent one.\n\n# Examples with feedback lessons\n\nExample (UNFAITHFUL, score 0): \"Prove that a normal operator on a complex inner-product space is self-adjoint if and only if all its eigenvalues are real.\"\nBad output:\n  theorem ... (T : V \u2192\u2097[\u2102] V) (h_normal : T.adjoint \u2218\u2097 T = T \u2218\u2097 T.adjoint) :\n    (T = T.adjoint) \u2194 (\u2200 z : \u2102, z \u2208 spectrum \u2102 T \u2192 z.im = 0) := by sorry\nWhy it failed: it quantifies over the whole spectrum instead of eigenvalues, and uses `z.im = 0` instead of stating the eigenvalues are real. Fix: quantify with `Module.End.HasEigenvalue T z` and conclude `\u2203 r : \u211d, z = r`.\n\nExample (DOES NOT COMPILE, score 0): \"Let H \u2264 K \u2264 G. Prove that |G:H| = |G:K|\u00b7|K:H| (do not assume G is finite).\" (Context defines `noncomputable def Subgroup.relindex {G : Type*} [Group G] (H K : Subgroup G) : \u2115 := H.relIndex K`.)\nBad output:\n  theorem index_multiplicativity {G : Type*} [Group G] (H K : Subgroup G) (h : H \u2264 K) :\n    Subgroup.index H = Subgroup.index K * (H / K).index := by sorry\nWhy it failed: `(H / K)` needs an `HDiv (Subgroup G) (Subgroup G)` instance, which does not exist \u2014 compilation error `failed to synthesize instance of type class HDiv (Subgroup G) (Subgroup G)`. The context provided `Subgroup.relindex` precisely to express |K : H|. Fix:\n  theorem index_multiplicativity {G : Type*} [Group G] (H K : Subgroup G) (h : H \u2264 K) :\n    H.index = K.index * Subgroup.relindex H K := by sorry\n\nExample (DOES NOT COMPILE, score 0): \"Let p be an odd prime and let 1 + 1/2 + ... + 1/(p-1) = a/b, where a, b are integers. Show that p | a.\"\nBad output:\n  theorem harmonic_sum_numerator_divisible_by_prime (p : \u2115) (hp_prime : Nat.Prime p) (hp_odd : Odd p)\n    (a b : \u2124) (hb : b \u2260 0) (h_sum : (\u2211 i in Finset.Icc 1 (p-1), (1 : \u211a) / i) = (a : \u211a) / (b : \u211a)) :\n    (p : \u2124) \u2223 a := by sorry\nWhy it failed: the big-operator binder `in` caused `error: unexpected token 'in'; expected ','`. Everything else (hypotheses `Nat.Prime p`, `Odd p`, `b \u2260 0`; coercions `(1 : \u211a) / i`, `(a : \u211a) / (b : \u211a)`; conclusion `(p : \u2124) \u2223 a`) was correct. Fix \u2014 use `\u2208`:\n  theorem harmonic_sum_numerator_divisible_by_prime (p : \u2115) (hp_prime : Nat.Prime p) (hp_odd : Odd p)\n    (a b : \u2124) (hb : b \u2260 0) (h_sum : (\u2211 i \u2208 Finset.Icc 1 (p - 1), (1 : \u211a) / i) = (a : \u211a) / (b : \u211a)) :\n    (p : \u2124) \u2223 a := by sorry\n\nExample (FAITHFUL, score 1): \"Prove that the products a b and b a are conjugate elements in a group.\"\nGood output:\n  theorem products_conjugate_in_group (G : Type*) [Group G] (a b : G) :\n    \u2203 g : G, a * b = g * (b * a) * g\u207b\u00b9 := by sorry\nWhy it passed: it quantifies over a group and elements a, b, and asserts the existence of g with a*b = g*(b*a)*g\u207b\u00b9, which precisely states that ab and ba are conjugate, matching the English statement.\n\nExample (FAITHFUL, score 1): \"If a is a nonzero integer, then for n>m show that (a^(2^n)+1, a^(2^m)+1) = 1 or 2 depending on whether a is odd or even.\"\nGood output:\n  theorem gcd_power_of_two_plus_one (a : \u2124) (ha : a \u2260 0) (n m : \u2115) (h : m < n) :\n    Int.gcd (a^(2^n) + 1) (a^(2^m) + 1) = if Odd a then 1 else 2 := by sorry\nWhy it passed: all hypotheses present (nonzero, m < n), same gcd expression, case distinction captured by `if Odd a then 1 else 2`.\n\nExample (FAITHFUL, score 1): \"Prove that for all n>1, \u2124/n\u2124 is not a group under multiplication of residue classes.\"\nGood output:\n  theorem residue_class_multiplication_not_group (n : \u2115) (hn : n > 1) :\n    \u2203 a : ZMod n, \u00ac\u2203 b : ZMod n, a * b = 1 := by sorry\nWhy it passed: arbitrary n with n > 1, and \"not a group under multiplication\" correctly encoded as the existence of an element with no multiplicative inverse.\n\n# Output format\n\nReturn exactly one theorem in one ```lean4 code block, ending with `:= by sorry`. No additional imports, opens, definitions, or proofs.\n`"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.57)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(0.50)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.50)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
